<!DOCTYPE html>
<html>
<head>
    <title></title>
    <style type="text/css">
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f3f6fa;
            font-family: "Microsoft YaHei", sans-serif;
        }

        .banxin {
            width: 1080px;
            max-width: 100%;
            margin: 0 auto;
            padding: 30px 40px;
            flex: 1;
            background-color: white;
        }

        .top {
            text-align: center;
        }

        .top img {
            width: 400px;
            max-width: 100%;
            display: block;
            margin: 0 auto;
        }

        .title {
            margin: 28px 0 40px;
            font-size: 35px;
            font-weight: bold;
            color: #172b4d;
            text-align: center;
        }

.content {
    display: flex;
    align-items: stretch;
    justify-content: flex-start;
    gap: 15px;
}

.text {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-size: 22px;
    line-height: 1.8;
    color: #333333;
}

.gif {
    width: 60px;
    align-self: stretch;
    object-fit: fill;
}


        footer {
            width: 100%;
            min-height: 80px;
            padding: 0 30px;
            background-color: #1677c8;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        footer p {
            margin: 0;
            color: black;
            font-size: 14px;
        }

        footer img {
            height: 80px;
            width: auto;
        }
    </style>
</head>
<body>

    <div class="banxin">
        <div class="top">
            <img src="3.2.png">
        </div>

        <div class="title">
            shiroko酱是有可能成为我母亲的女人呀！
        </div>

        <div class="content">
            <div class="text">
                <div>入社团需要40个大洋入场费</div>
                <div>工商你的胆子真是肥嘟嘟的</div>
            </div>

            <img class="gif" src="1.2.gif">
        </div>
    </div>

    <footer>
        <p>© 2021 NEXON Korea Corp. &amp; NEXON GAMES Co., Ltd. All Rights Reserved.</p>
        <img src="4.png">
    </footer>

</body>
</html>
